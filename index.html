<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting availability</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; table-layout: fixed; }
  th, td { border: 1px solid #ccc; text-align: center; padding: 0; }
  th { background: #f4f4f4; padding: .4rem; font-size: .85rem; }
  td label { display: block; padding: .5rem; cursor: pointer; }
  td input { width: 1.1rem; height: 1.1rem; cursor: pointer; }
  td:has(input:checked) { background: #d5f5e3; }
  td.off { background: #e1e0e0; }
  button { padding: .6rem 1.4rem; font-size: 1rem; }
  #msg { margin-top: 1rem; font-weight: 600; }
</style>
</head>
<body>
<h1>PhD Update Meeting Availability</h1>
<p id="greeting"></p>
<p>Tick every one-hour slot that suits you. You can reopen this link and resubmit; your latest response replaces the earlier one.</p>
<div id="grid"></div>
<button id="submit">Submit</button>
<p id="msg"></p>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjF3pVDkJITWx1N6-wnQAYi52Qim0fKEOyrk2GyjW557zGy0mMM1Pk8UNU3t30veCT/exec';
const HOURS = [10, 11, 12, 13, 14, 15, 16];   // meeting start times

const params = new URLSearchParams(location.search);
const token = params.get('t');
const DEFAULT_START = '2026-11-30';
const BLOCKED = new Set([
		// 'YYYY-YY-DD', 		// whole day - 'YYYY-MM-DD'
		'2026-12-03 15:00',		// Slot - 'YYYY-MM-DD HH:MM'
		'2026-12-03 16:00',
		'2026-12-02 13:00',
		'2026-12-02 14:00',
		'2026-12-09 13:00',
		'2026-12-09 14:00',
		'2026-12-10 15:00',
		'2026-12-10 16:00'
		]);
const start = params.get('start') || DEFAULT_START;
const msg = document.getElementById('msg');
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

if (!token || !/^\d{4}-\d{2}-\d{2}$/.test(start || '')) {
  document.getElementById('submit').hidden = true;
  msg.textContent = 'This link is incomplete. Please use the link you were sent.';
} else {
  fetch(`${SCRIPT_URL}?t=${encodeURIComponent(token)}`)
    .then(r => r.json())
    .then(out => {
      if (out.ok) {
        document.getElementById('greeting').textContent = `Hi ${out.name},`;
      } else {
        document.getElementById('submit').hidden = true;
        msg.textContent = "This link isn't recognised. Please check you used the full link I sent.";
      }
    })
    .catch(() => {});  // if the lookup fails, the form still works without a greeting

  const [y, m, d] = start.split('-').map(Number);
  const weeks = [[], []];
  for (let i = 0; i < 14; i++) {
    const day = new Date(y, m - 1, d + i);
    if (day.getDay() !== 0 && day.getDay() !== 6) weeks[i < 7 ? 0 : 1].push(day);
  }

  const grid = document.getElementById('grid');
  for (const days of weeks) {
    if (!days.length) continue;
    let html = '<tr><th></th>' + days.map(day =>
      `<th>${day.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</th>`
    ).join('') + '</tr>';
        for (const h of HOURS) {
      html += `<tr><th>${pad(h)}:00–${pad(h + 1)}:00</th>` + days.map(day => {
        const val = `${iso(day)} ${pad(h)}:00`;
        return (BLOCKED.has(iso(day)) || BLOCKED.has(val))
          ? '<td class="off"></td>'
          : `<td><label><input type="checkbox" value="${val}"></label></td>`;
      }).join('') + '</tr>';
    }

    const table = document.createElement('table');
    table.innerHTML = html;
    grid.appendChild(table);
  }

  document.getElementById('submit').addEventListener('click', async () => {
    const slots = [...document.querySelectorAll('#grid input:checked')].map(i => i.value);
    if (!slots.length && !confirm('No slots ticked. Submit anyway?')) return;
    msg.textContent = 'Sending…';
    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // avoids a CORS preflight Apps Script can't answer
        body: JSON.stringify({ token, slots })
      });
      const out = await res.json();
      msg.textContent = out.ok ? 'Thanks, your availability has been recorded. I hope you have a good day.' : `Error: ${out.error}`;
    } catch {
      msg.textContent = 'Could not send. Please try again, or email me and tell me this thing is broken.';
    }
  });
}
</script>
</body>
</html>
